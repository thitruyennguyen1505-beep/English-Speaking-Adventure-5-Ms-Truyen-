function mk(type,c){const qs=[];if(type==="build")return c.p.slice(0,5).map(s=>({build:s}));
 if(type==="order"){const L=c.d.slice(0,4).map(l=>l.t);return L.length>=3?[{build:L.join(" "),items:L}]:[]}

 const W=c.v;sh(W).slice(0,6).forEach(w=>{const pool=W.length>=nopt()?W:POOL(),{o,c:k}=opts(w,pool,"en");

function teach(){const c=C(TU),u=uid(TU);return`<h2>👩‍🏫 Teacher Resources</h2><div class="card"><label>Chọn bài: <select onchange="TU=this.value;render()">${ALL.map(x=>`<option value="${x.id}" ${x.id===TU?"selected":""}>${x.n} ${esc(x.t)}</option>`).join("")}</select></label>
${u.ok?"":`<p class="warn">Tên bài này chưa xác minh với sách. Hãy đối chiếu.</p>`}
<p><small>Mỗi dòng: <code>V: english|tiếng Việt|emoji</code> · <code>P: mẫu câu</code> · <code>A: lời thoại</code> / <code>B: lời đáp</code>. Chỉ nhập nội dung có trong sách của bạn.</small></p>
${TU==="demo"?"<p>Demo là nội dung mẫu cố định. Hãy chọn một Unit khác để nhập nội dung thật.</p>":`<textarea id="ta" aria-label="Nội dung bài">${esc(rawOf(TU))}</textarea><br><button class="g" onclick="P.raw[TU]=ta.value;save();toast('Đã lưu trên trình duyệt này.');render()">💾 Lưu nội dung</button>`}
<button onclick="print()">🖨️ In thẻ hội thoại</button></div>
<div class="card"><h3>Tổng quan: ${c.v.length} từ · ${c.p.length} mẫu câu · ${c.d.length} lời thoại</h3><p><b>Gợi ý hoạt động:</b> làm việc cặp (A/B đổi vai), hỏi–đáp theo nhóm 4, bốc thăm thẻ từ rồi đặt câu.</p><p><b>Rubric tự lập (không phải tiêu chí chính thức):</b> nói rõ · dùng đúng từ · dùng đúng mẫu câu · trả lời đúng câu hỏi (mỗi tiêu chí 0–2 điểm).</p></div>
<div class="pr">${c.d.length?`<h2>${esc(u.t)}: Conversation cards</h2>`+c.d.map(l=>`<div class="pc"><b>${l.s}:</b> ${esc(l.t)}</div>`).join(""):""}${c.v.map(w=>`<div class="pc">${w.pic} <b>${esc(w.en)}</b> – ${esc(w.vi)}</div>`).join("")}</div>`}
render();
